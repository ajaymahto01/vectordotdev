[sources.nginx_logs]
type = "file"
include = ["/logs/nginx/access.log"]
ignore_older = 86400
read_from = "beginning"

[sinks.elasticsearch]
type = "elasticsearch"
inputs = ["nginx_logs"]
endpoint = "http://elasticsearch:9200"
index = "nginx-logs-%Y.%m.%d"
compression = "gzip"
batch.size = 1000
batch.timeout = 5

[transforms.json]
type = "remap"
inputs = ["nginx_logs"]
source = '''
. = parse_json!(.message)
'''

# Vector config: tail nginx logs (mounted at /var/log/nginx inside the container),
# parse access logs with a grok parser and forward both access and error logs to Elasticsearch.

[sources.nginx_access]
type = "file"
include = ["/var/log/nginx/access.log"]
ignore_older = 86400
read_from = "beginning"

[sources.nginx_error]
type = "file"
include = ["/var/log/nginx/error.log"]
ignore_older = 86400
read_from = "beginning"

[transforms.parse_access]
type = "grok_parser"
inputs = ["nginx_access"]
# Use a standard apache combined log pattern (includes referer and user agent)
pattern = "%{COMBINEDAPACHELOG}"

[transforms.format_error]
type = "remap"
inputs = ["nginx_error"]
source = '''
# Keep the original message under error_message for clearer indexing
error_message = .message
'''

[sinks.elasticsearch]
type = "elasticsearch"
inputs = ["parse_access", "format_error"]
endpoint = "http://elasticsearch:9200"
index = "nginx-logs-%Y.%m.%d"
compression = "gzip"

# Keep the configuration minimal and let Vector use sensible defaults for batching/backoff.